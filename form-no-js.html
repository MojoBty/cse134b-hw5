      </ul>
    </nav>
  </header>

  <main>
    <section>
        <h2>Send a Message</h2>
        <p id="form-note">
          This demo sends your entries to a test endpoint. Use sample contact
          information.
        </p>
      
        <form class="contact-form"
              action="https://httpbin.org/post"
              method="post"
              aria-describedby="form-note">
          <fieldset>
            <legend>Your Contact Information</legend>
      
            <label for="name">Name (required, 1-100 characters)</label>
            <input type="text" id="name" name="name" autocomplete="name"
                minlength="1" maxlength="100" required>
      
            <label for="email">Email (required)</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </fieldset>
      
          <fieldset>
            <legend>Your Message</legend>
      
            <label for="comments">Comments (required, 10-10000 characters)</label>
            <textarea id="comments" name="comments" rows="6"
                minlength="10" maxlength="10000" required></textarea>
          </fieldset>
      
          <input type="hidden" name="possible_bot" value="true">
      
          <button type="submit">Send Message</button>
        </form>
      </section>
  </main>

  <footer>
    <p><a href="contact.html" aria-current="page">Contact me</a></p>
